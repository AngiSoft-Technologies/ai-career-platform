name: mboqara

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mboqara
      POSTGRES_PASSWORD: mboqara
      POSTGRES_DB: mboqara
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mboqara -d mboqara"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/uploads;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional stage 2 workspace. It is behind the `browser` profile so existing
  # `docker compose up` runs never download Playwright or expose port 8787.
  browser-runtime:
    build:
      context: ./services/browser-runtime
    profiles:
      - browser
    environment:
      BROWSER_RUNTIME_TOKEN: ${BROWSER_RUNTIME_TOKEN:?Set BROWSER_RUNTIME_TOKEN to start the browser runtime}
      BROWSER_UPLOAD_SECRET: ${BROWSER_UPLOAD_SECRET:-dev-upload-secret}
      UPLOAD_ALLOWED_HOSTS: ${UPLOAD_ALLOWED_HOSTS:-cdn1.angisoft.co.ke}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-4}
      FRAME_RATE_LIMIT_MS: ${FRAME_RATE_LIMIT_MS:-700}
    ports:
      - "8787:8787"
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
