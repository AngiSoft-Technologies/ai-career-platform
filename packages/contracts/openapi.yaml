openapi: 3.1.0
info:
  title: Job Radar API
  version: "1.0.0"
  description: |
    Versioned REST API for the Job Radar platform (AngiSoft Technologies).

    Base URL: `{backend_url}/v1`. The legacy `/api/v1` prefix remains as a
    compatibility alias. Every response carries `x-api-version: v1`.

    Authentication: `Authorization: Bearer <neon-auth-jwt>`. Requests without a
    token run in demo mode (single seeded candidate) while `DEMO_MODE=true`.
servers:
  - url: https://job-radar-api-angisoft.fly.dev/v1
    description: Production
  - url: http://localhost:8088/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: profile
  - name: opportunities
  - name: applications
  - name: documents
  - name: ai
  - name: sources
  - name: followups
  - name: admin
  - name: public
paths:
  /profile:
    get:
      tags: [profile]
      summary: Get the signed-in candidate profile
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/CandidateProfile" }
    put:
      tags: [profile]
      summary: Update the candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                headline: { type: string }
                summary: { type: string }
                location: { type: string }
                country: { type: string }
                yearsExperience: { type: integer }
                seniority:
                  type: string
                  enum: [intern, junior, mid, senior, lead]
                desiredRoles:
                  type: array
                  items: { type: string }
                skills:
                  type: array
                  items: { type: string }
                preferredCountries:
                  type: array
                  items: { type: string }
                preferredLocations:
                  type: array
                  items: { type: string }
                remotePreferred: { type: boolean }
      responses:
        "200": { description: Updated profile }
        "400": { $ref: "#/components/responses/BadRequest" }
  /profile/preferences:
    get:
      tags: [profile]
      summary: Get job preferences
      responses:
        "200": { description: Preferences }
    put:
      tags: [profile]
      summary: Replace job preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredCountries:
                  type: array
                  items: { type: string }
                preferredLocations:
                  type: array
                  items: { type: string }
                preferredRoles:
                  type: array
                  items: { type: string }
                desiredSeniority: { type: string, enum: [intern, junior, mid, senior, lead, executive] }
                minSalary: { type: integer }
                currency: { type: string }
                remoteOnly: { type: boolean }
                willingToRelocate: { type: boolean }
                notificationsEnabled: { type: boolean }
      responses:
        "200": { description: Saved preferences }
  /opportunities:
    get:
      tags: [opportunities]
      summary: Search and rank opportunities
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: workMode, in: query, schema: { type: string, enum: [onsite, hybrid, remote] } }
        - { name: seniority, in: query, schema: { type: string, enum: [intern, junior, mid, senior, lead] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: semantic, in: query, schema: { type: boolean }, description: "Blend vector similarity into ranking" }
        - { name: ranked, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Ranked opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  cached: { type: boolean }
  /opportunities/{id}:
    get:
      tags: [opportunities]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Opportunity with match }
        "404": { $ref: "#/components/responses/NotFound" }
  /opportunities/{id}/workspace:
    get:
      tags: [opportunities]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Application blueprint for an opportunity
      responses:
        "200": { description: Blueprint }
  /applications:
    get:
      tags: [applications]
      responses:
        "200": { description: Applications }
    post:
      tags: [applications]
      summary: Create (or fetch) an application for an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
                status: { type: string, enum: [DISCOVERED, SHORTLISTED, ANALYZED, APPLICATION_PREPARATION, READY_TO_APPLY, APPLIED, ACKNOWLEDGED, NO_RESPONSE, SCREENING, ASSESSMENT, INTERVIEW, OFFER, REJECTED, WITHDRAWN, EXPIRED, FAILED] }
      responses:
        "201": { description: Application }
  /applications/{id}/status:
    patch:
      tags: [applications]
      summary: Update application status (optimistic locking via version)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { type: string }
                version: { type: integer }
                note: { type: string }
      responses:
        "200": { description: Updated application }
        "409": { $ref: "#/components/responses/Conflict" }
  /applications/{id}/workspace:
    get:
      tags: [applications]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Full application workspace for an application
      responses:
        "200": { description: Workspace }
  /applications/{id}/analyze:
    post:
      tags: [applications]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Analyse the external application page (platform, fields, questions)
      responses:
        "200": { description: Analysis }
        "502": { description: Application page could not be analysed }
  /applications/{id}/followups:
    post:
      tags: [followups]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Schedule a follow-up reminder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dueAt: { type: string, format: date-time }
                channel: { type: string, enum: [email, whatsapp, linkedin, phone, manual] }
                note: { type: string }
      responses:
        "201": { description: Follow-up created }
  /followups:
    get:
      tags: [followups]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENT, COMPLETED, CANCELLED, OVERDUE] } }
      responses:
        "200": { description: Follow-ups }
  /followups/{id}:
    patch:
      tags: [followups]
      summary: Update a follow-up reminder
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [PENDING, SENT, COMPLETED, CANCELLED, OVERDUE] }
                note: { type: string }
                dueAt: { type: string, format: date-time }
      responses:
        "200": { description: Updated follow-up }
  /documents:
    get:
      tags: [documents]
      parameters:
        - { name: opportunityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Documents }
  /documents/generate:
    post:
      tags: [documents]
      summary: Generate a document (cv, cover_letter, application_email, answer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId, type]
              properties:
                opportunityId: { type: string, format: uuid }
                applicationId: { type: string, format: uuid }
                type: { type: string, enum: [cv, cover_letter, application_email, answer] }
      responses:
        "201": { description: Generated document }
  /documents/{id}:
    get:
      tags: [documents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Document details }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [documents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        "200": { description: Updated document }
  /documents/{id}/export:
    post:
      tags: [documents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [pdf, docx, pptx, txt, html] }
      responses:
        "200": { description: Exported document }
  /documents/validate:
    post:
      tags: [documents]
      summary: ATS-compatibility validation of a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 200000 }
                documentId: { type: string, format: uuid }
                opportunityId: { type: string, format: uuid }
                keywords: { type: array, items: { type: string, maxLength: 80 }, maxItems: 60 }
      responses:
        "200": { description: ATS validation report }
  /documents/upload-url:
    post:
      tags: [documents]
      summary: Create a presigned upload target for a CV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename: { type: string }
                contentType: { type: string }
      responses:
        "200": { description: Presigned target }
  /ai/status:
    get:
      tags: [ai]
      responses:
        "200": { description: AI provider status }
  /ai/job-summary:
    post:
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
      responses:
        "200": { description: Job insight }
  /ai/cover-letter:
    post:
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
                tone: { type: string, enum: [professional, enthusiastic, concise] }
                save: { type: boolean }
      responses:
        "200": { description: Cover letter }
  /ai/profile-analysis:
    get:
      tags: [ai]
      responses:
        "200": { description: Profile analysis }
  /matches:
    get:
      tags: [opportunities]
      summary: List opportunities ranked for the current candidate
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: workMode, in: query, schema: { type: string, enum: [onsite, hybrid, remote] } }
        - { name: seniority, in: query, schema: { type: string, enum: [intern, junior, mid, senior, lead] } }
        - { name: semantic, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Ranked opportunities with match explanations }
  /matches/{opportunityId}:
    get:
      tags: [opportunities]
      parameters: [{ name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Match for one opportunity }
    post:
      tags: [opportunities]
      parameters: [{ name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Recalculated match }
  /companies:
    get:
      tags: [opportunities]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Companies and active role counts }
  /companies/{slug}:
    get:
      tags: [opportunities]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Company profile and active roles }
  /sources:
    get:
      tags: [sources]
      summary: List job sources (curated + submitted by the user)
      responses:
        "200": { description: Sources }
    post:
      tags: [sources]
      summary: Submit a job source (board, careers page, ATS) for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                name: { type: string }
                notes: { type: string }
      responses:
        "201": { description: Source submitted (status pending_review) }
  /sources/catalog:
    get:
      tags: [sources]
      summary: Curated list of supported Kenyan and global job boards
      responses:
        "200": { description: Catalog }
  /sources/queue:
    get:
      tags: [sources]
      summary: List sources awaiting curation
      responses:
        "200": { description: Source review queue }
  /connections:
    get:
      tags: [profile]
      responses:
        "200": { description: Connected providers }
  /connections/{provider}/start:
    post:
      tags: [profile]
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Provider authorization URL }
  /connections/{provider}/callback:
    post:
      tags: [profile]
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Provider connection result }
  /connections/{id}:
    delete:
      tags: [profile]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Connection revoked }
  /admin/stats:
    get:
      tags: [admin]
      responses:
        "200": { description: Admin dashboard statistics }
  /admin/roles:
    get:
      tags: [admin]
      responses:
        "200": { description: Available role assignments }
  /admin/roles/assign:
    post:
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string }
      responses:
        "200": { description: Role assigned }
  /admin/roles/{userId}/{role}:
    delete:
      tags: [admin]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Role removed }
  /admin/users:
    get:
      tags: [admin]
      responses:
        "200": { description: User list }
  /admin/taxonomy:
    get:
      tags: [admin]
      responses:
        "200": { description: Profession taxonomy }
    post:
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201": { description: Taxonomy entry created or updated }
  /admin/scam-corpus:
    get:
      tags: [admin]
      responses:
        "200": { description: Scam indicators }
    post:
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201": { description: Scam indicator added }
  /admin/event-stream:
    get:
      tags: [admin]
      parameters: [{ name: limit, in: query, schema: { type: integer } }]
      responses:
        "200": { description: Recent audit events }
  /me:
    get:
      tags: [profile]
      responses:
        "200": { description: Current user and roles }
  /stats:
    get:
      tags: [public]
      security: []
      responses:
        "200": { description: Public aggregate counters }
  /public/cohort:
    get:
      tags: [public]
      security: []
      responses:
        "200": { description: Beta cohort capacity }
  /public/featured:
    get:
      tags: [public]
      security: []
      responses:
        "200": { description: Featured active opportunities }
  /public/contact:
    post:
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                topic: { type: string }
                message: { type: string }
      responses:
        "201": { description: Message accepted }
  /content/benefits:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/comparison:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/about/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/about/benefits:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/about/comparison:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/features/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/features:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/faq/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/faq:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/pricing/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/pricing/plans:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/stories/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/stories:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/security/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/security:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/privacy/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/privacy:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/terms/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/terms:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/download/hero:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /content/download/features:
    get:
      tags: [public]
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicContent" }
  /stream/notifications:
    get:
      tags: [profile]
      responses:
        "200": { description: Server-sent notification stream, text/event-stream }
  /mcp/status:
    get:
      tags: [ai]
      responses:
        "200": { description: MCP service status }
  /sources/{id}/verify:
    post:
      tags: [sources]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Run source verification (reachability, platform detection, job links)
      responses:
        "200": { description: Verification result }
  /mcp:
    get:
      tags: [ai]
      summary: MCP tool inventory
      responses:
        "200": { description: Tools }
    post:
      tags: [ai]
      summary: MCP JSON-RPC endpoint (initialize, tools/list, tools/call)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: { type: string }
                id: { type: string }
                method: { type: string }
                params: { type: object }
      responses:
        "200": { description: JSON-RPC response }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    PublicContent:
      description: Public marketing copy and feature descriptions
      headers:
        Cache-Control:
          schema: { type: string }
      content:
        application/json:
          schema:
            oneOf:
              - { type: object, additionalProperties: true }
              - { type: array, items: { type: object, additionalProperties: true } }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version conflict or invalid transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
    CandidateProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        fullName: { type: string }
        headline: { type: string }
        summary: { type: string }
        location: { type: string }
        country: { type: string }
        yearsExperience: { type: integer }
        seniority: { type: string }
        desiredRoles: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        preferredCountries: { type: array, items: { type: string } }
        preferredLocations: { type: array, items: { type: string } }
        remotePreferred: { type: boolean }
        version: { type: integer }
    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        companyName: { type: string }
        companySlug: { type: string }
        companyWebsite: { type: string }
        country: { type: string }
        city: { type: string }
        workMode: { type: string }
        seniority: { type: string }
        employmentType: { type: string }
        salaryMin: { type: integer }
        salaryMax: { type: integer }
        currency: { type: string }
        applyUrl: { type: string }
        applicationMethod: { type: string }
        platform: { type: string }
        postedAt: { type: string, format: date-time }
        skills: { type: array, items: { type: string } }
        match:
          type: object
