components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    PublicContent:
      description: Public marketing copy and feature descriptions
      headers:
        Cache-Control:
          schema: { type: string }
      content:
        application/json:
          schema:
            oneOf:
              - { type: object, additionalProperties: true }
              - { type: array, items: { type: object, additionalProperties: true } }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version conflict or invalid transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
    AuthSession:
      type: object
      required:
        - token
        - tokenType
        - expiresAt
        - refreshToken
        - refreshExpiresAt
      properties:
        token: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/AuthUser" }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    CandidateProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        fullName: { type: string }
        headline: { type: string }
        summary: { type: string }
        location: { type: string }
        country: { type: string }
        yearsExperience: { type: integer }
        seniority: { type: string }
        desiredRoles: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        preferredCountries: { type: array, items: { type: string } }
        preferredLocations: { type: array, items: { type: string } }
        remotePreferred: { type: boolean }
        version: { type: integer }
    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        companyName: { type: string }
        companySlug: { type: string }
        companyWebsite: { type: string }
        country: { type: string }
        city: { type: string }
        workMode: { type: string }
        seniority: { type: string }
        employmentType: { type: string }
        salaryMin: { type: integer }
        salaryMax: { type: integer }
        currency: { type: string }
        applyUrl: { type: string }
        applicationMethod: { type: string }
        platform: { type: string }
        postedAt: { type: string, format: date-time }
        skills: { type: array, items: { type: string } }
        match:
          type: object
          properties:
            score: { type: number }
            explanation: { type: string }
            gaps: { type: array, items: { type: string } }
            factors:
              type: object
              properties:
                skills: { type: number }
                seniority: { type: number }
                location: { type: number }
                role: { type: number }
                freshness: { type: number }
    ApplicationAnalysis:
      type: object
      properties:
        platform: { type: string }
        method: { type: string, enum: [website, email, ats, form] }
        analysisUrl: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string }
              required: { type: boolean }
              mapped: { type: boolean }
              suggestedValue: { type: string }
              options: { type: array, items: { type: string } }
        questions:
          type: array
          items:
            type: object
            properties:
              question: { type: string }
              answer: { type: string }
              confidence: { type: number }
        requiredDocuments: { type: array, items: { type: string } }
        instructions: { type: array, items: { type: string } }
        requiresUserInput: { type: array, items: { type: string } }
        deadline: { type: string }
        rawTitle: { type: string }
        emailRecipient: { type: string }
        emailSubject: { type: string }
        emailBody: { type: string }
