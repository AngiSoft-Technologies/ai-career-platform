openapi: 3.1.0
info:
  title: Job Radar API
  version: "1.0.0"
  description: |
    Versioned REST API for the Job Radar platform (AngiSoft Technologies).

    Base URL: `{backend_url}/v1`. The legacy `/api/v1` prefix remains as a
    compatibility alias. Every response carries `x-api-version: v1`.

    Authentication: `Authorization: Bearer <access_token>`. Access tokens are
    minted by this API at `/v1/auth/*` (15 minute lifetime). Refresh them with
    `POST /v1/auth/refresh`; the refresh token rotates on every use and the
    presented token is single-use. Requests without a token run in demo mode
    (single seeded candidate) while `DEMO_MODE=true`.

    The API owns identity. Clients exchange credentials for Job Radar tokens
    and never contact the identity provider directly.
servers:
  - url: https://job-radar-api-angisoft.fly.dev/v1
    description: Production
  - url: http://localhost:8088/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: profile
  - name: opportunities
  - name: applications
  - name: documents
  - name: ai
  - name: sources
  - name: followups
  - name: admin
  - name: public
paths:
  /auth/sign-up:
    post:
      tags: [auth]
      summary: Create an account with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        "201":
          description: Account created
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "202":
          description: Account created; email confirmation required before sign-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Too many attempts }
  /auth/sign-in:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }
  /auth/google:
    post:
      tags: [auth]
      summary: Sign in with a Google ID token
      description: |
        Exchanges a Google ID token for Job Radar tokens. The token is verified
        server-side against Google's JWKS and never leaves the API.

        Most clients use `/auth/google/start` instead, which runs the whole
        handshake in the browser and needs no provider SDK.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                nonce: { type: string }
      responses:
        "200":
          description: Signed in
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Token could not be verified }
  /auth/google/start:
    get:
      tags: [auth]
      summary: Start the Google sign-in flow
      description: |
        Redirects the browser to the identity provider, which runs the Google
        consent screen. The provider returns to the API, which redeems the
        authorization code and sends the browser to `redirect_uri` with the
        session in the URL fragment.

        `redirect_uri` must be on the API's allowlist. App schemes such as
        `jobradar://auth/callback` are allowed for mobile.
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "302":
          description: Redirect to the identity provider
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/google/callback:
    get:
      tags: [auth]
      summary: Complete the Google sign-in flow
      description: |
        The provider redirects here with an authorization code. The API redeems
        it, mints the session and redirects to the app with the tokens in the
        URL fragment.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the app with the session
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/google/link-ticket:
    post:
      tags: [auth]
      summary: Issue a ticket for connecting a provider account
      description: |
        Issues a single-use ticket that binds a provider sign-in to the signed-in
        account. The callback links the provider identity instead of creating a
        new account.
      responses:
        "200":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        "401": { description: Unauthorized }
  /auth/google/link/start:
    get:
      tags: [auth]
      summary: Start the provider sign-in that links an account
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "302":
          description: Redirect to the identity provider
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/password/reset-request:
    post:
      tags: [auth]
      summary: Request a password reset link
      description: |
        The response is the same whether or not the address has an account, so
        the endpoint cannot be used to discover accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Reset requested }
        "429": { description: Too many attempts }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password changed and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: Too many attempts }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      description: |
        Returns a new access token and a new refresh token. The presented
        refresh token is single-use. Reusing one revokes the whole token
        family and forces both the caller and the original owner to sign in
        again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Tokens rotated
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Refresh token invalid, expired, or reused }
  /auth/sign-out:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: Signed out }
  /auth/session:
    get:
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current session
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  user: { $ref: "#/components/schemas/AuthUser" }
                  roles: { type: array, items: { type: string } }
                  permissions: { type: array, items: { type: string } }
                  mode: { type: string, enum: [live, demo] }
        "401": { description: Unauthorized }
  /profile:
    get:
      tags: [profile]
      summary: Get the signed-in candidate profile
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/CandidateProfile" }
    put:
      tags: [profile]
      summary: Update the candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                headline: { type: string }
                summary: { type: string }
                location: { type: string }
                country: { type: string }
                yearsExperience: { type: integer }
                seniority:
                  type: string
                  enum: [intern, junior, mid, senior, lead]
                desiredRoles:
                  type: array
                  items: { type: string }
                skills:
                  type: array
                  items: { type: string }
                preferredCountries:
                  type: array
                  items: { type: string }
                preferredLocations:
                  type: array
                  items: { type: string }
                remotePreferred: { type: boolean }
      responses:
        "200": { description: Updated profile }
        "400": { $ref: "#/components/responses/BadRequest" }
  /profile/preferences:
    get:
      tags: [profile]
      summary: Get job preferences
      responses:
        "200": { description: Preferences }
    put:
      tags: [profile]
      summary: Replace job preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredCountries:
                  type: array
                  items: { type: string }
                preferredLocations:
                  type: array
                  items: { type: string }
                preferredRoles:
                  type: array
                  items: { type: string }
                desiredSeniority: { type: string, enum: [intern, junior, mid, senior, lead, executive] }
                minSalary: { type: integer }
                currency: { type: string }
                remoteOnly: { type: boolean }
                willingToRelocate: { type: boolean }
                notificationsEnabled: { type: boolean }
      responses:
        "200": { description: Saved preferences }
  /opportunities:
    get:
      tags: [opportunities]
      summary: Search and rank opportunities
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: workMode, in: query, schema: { type: string, enum: [onsite, hybrid, remote] } }
        - { name: seniority, in: query, schema: { type: string, enum: [intern, junior, mid, senior, lead] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: semantic, in: query, schema: { type: boolean }, description: "Blend vector similarity into ranking" }
        - { name: ranked, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Ranked opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  cached: { type: boolean }
  /opportunities/{id}:
    get:
      tags: [opportunities]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Opportunity with match }
        "404": { $ref: "#/components/responses/NotFound" }
  /opportunities/{id}/workspace:
    get:
      tags: [opportunities]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Application blueprint for an opportunity
      responses:
        "200": { description: Blueprint }
  /applications:
    get:
      tags: [applications]
      responses:
        "200": { description: Applications }
    post:
      tags: [applications]
      summary: Create (or fetch) an application for an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
                status: { type: string, enum: [DISCOVERED, SHORTLISTED, ANALYZED, APPLICATION_PREPARATION, READY_TO_APPLY, APPLIED, ACKNOWLEDGED, NO_RESPONSE, SCREENING, ASSESSMENT, INTERVIEW, OFFER, REJECTED, WITHDRAWN, EXPIRED, FAILED] }
      responses:
        "201": { description: Application }
  /applications/{id}/status:
    patch:
      tags: [applications]
      summary: Update application status (optimistic locking via version)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { type: string }
                version: { type: integer }
                note: { type: string }
      responses:
        "200": { description: Updated application }
        "409": { $ref: "#/components/responses/Conflict" }
  /applications/{id}/workspace:
    get:
      tags: [applications]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Full application workspace for an application
      responses:
        "200": { description: Workspace }
  /applications/{id}/analyze:
    post:
      tags: [applications]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Analyse the external application page (platform, fields, questions)
      responses:
        "200":
          description: Best-effort application page analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { $ref: "#/components/schemas/ApplicationAnalysis" }
        "502": { description: Application page could not be analysed }
  /applications/{id}/followups:
    post:
      tags: [followups]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Schedule a follow-up reminder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dueAt: { type: string, format: date-time }
                channel: { type: string, enum: [email, whatsapp, linkedin, phone, manual] }
                note: { type: string }
      responses:
        "201": { description: Follow-up created }
  /followups:
    get:
      tags: [followups]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENT, COMPLETED, CANCELLED, OVERDUE] } }
      responses:
        "200": { description: Follow-ups }
  /followups/{id}:
    patch:
      tags: [followups]
      summary: Update a follow-up reminder
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [PENDING, SENT, COMPLETED, CANCELLED, OVERDUE] }
                note: { type: string }
                dueAt: { type: string, format: date-time }
      responses:
        "200": { description: Updated follow-up }
  /documents:
    get:
      tags: [documents]
      parameters:
        - { name: opportunityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Documents }
  /documents/generate:
    post:
      tags: [documents]
      summary: Generate a document (cv, cover_letter, application_email, answer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId, type]
              properties:
                opportunityId: { type: string, format: uuid }
                applicationId: { type: string, format: uuid }
                type: { type: string, enum: [cv, cover_letter, application_email, answer] }
      responses:
        "201": { description: Generated document }
  /documents/{id}:
    get:
      tags: [documents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Document details }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [documents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        "200": { description: Updated document }
  /documents/{id}/tailor:
    post:
      tags: [documents]
      summary: Prepare a job-specific resume or cover-letter proposal for review
      description: Uses the selected source document and profile as factual evidence. Returns an unsaved proposal; the source document is unchanged.
      parameters: [{ name: id, in: path, required: true, description: Source document ID, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
      responses:
        "200":
          description: Proposed tailored document and review metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    type: object
                    required: [sourceDocumentId, opportunityId, type, title, content, changes, matchedRequirements, uncoveredRequirements]
                    properties:
                      sourceDocumentId: { type: string, format: uuid }
                      opportunityId: { type: string, format: uuid }
                      type: { type: string, enum: [cv, cover_letter] }
                      title: { type: string }
                      content: { type: string }
                      changes: { type: array, items: { type: string } }
                      matchedRequirements: { type: array, items: { type: string } }
                      uncoveredRequirements: { type: array, items: { type: string } }
        "400": { description: Source document type cannot be tailored }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Tailoring provider returned an invalid or ungrounded proposal }
        "503": { description: AI provider is not configured }
  /documents/{id}/versions:
    post:
      tags: [documents]
      summary: Save an approved document as an independent version
      parameters: [{ name: id, in: path, required: true, description: Source document ID, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 240 }
                content: { type: string, maxLength: 200000 }
                opportunityId: { type: string, format: uuid, description: Target job for this version }
      responses:
        "201": { description: Saved independent version; source is unchanged }
        "404": { $ref: "#/components/responses/NotFound" }
  /documents/{id}/export:
    post:
      tags: [documents]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [pdf, docx, pptx, txt, html] }
      responses:
        "200": { description: Exported document }
  /documents/validate:
    post:
      tags: [documents]
      summary: ATS-compatibility validation of a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 200000 }
                documentId: { type: string, format: uuid }
                opportunityId: { type: string, format: uuid }
                keywords: { type: array, items: { type: string, maxLength: 80 }, maxItems: 60 }
      responses:
        "200": { description: ATS validation report }
  /documents/upload-url:
    post:
      tags: [documents]
      summary: Create a presigned upload target for a CV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename: { type: string }
                contentType: { type: string }
      responses:
        "200": { description: Presigned target }
  /ai/status:
    get:
      tags: [ai]
      responses:
        "200": { description: AI provider status }
  /ai/job-summary:
    post:
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
      responses:
        "200": { description: Job insight }
  /ai/cover-letter:
    post:
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: string, format: uuid }
                tone: { type: string, enum: [professional, enthusiastic, concise] }
                save: { type: boolean }
      responses:
        "200": { description: Cover letter }
  /ai/profile-analysis:
    get:
      tags: [ai]
      responses:
        "200": { description: Profile analysis }
  /matches:
    get:
      tags: [opportunities]
      summary: List opportunities ranked for the current candidate
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: workMode, in: query, schema: { type: string, enum: [onsite, hybrid, remote] } }
        - { name: seniority, in: query, schema: { type: string, enum: [intern, junior, mid, senior, lead] } }
        - { name: semantic, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Ranked opportunities with match explanations }
  /matches/{opportunityId}:
    get:
      tags: [opportunities]
      parameters: [{ name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Match for one opportunity }
    post:
      tags: [opportunities]
      parameters: [{ name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Recalculated match }
  /companies:
    get:
      tags: [opportunities]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Companies and active role counts }
  /companies/{slug}:
    get:
      tags: [opportunities]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Company profile and active roles }
  /sources:
    get:
      tags: [sources]
      summary: List job sources (curated + submitted by the user)
      responses:
        "200": { description: Sources }
    post:
      tags: [sources]
      summary: Submit a job source (board, careers page, ATS) for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                name: { type: string }
                notes: { type: string }
      responses:
        "201": { description: Source submitted (status pending_review) }
  /sources/catalog:
    get:
      tags: [sources]
      summary: Curated list of supported Kenyan and global job boards
      responses:
        "200": { description: Catalog }
  /sources/queue:
    get:
      tags: [sources]
      summary: List sources awaiting curation
      responses:
        "200": { description: Source review queue }
  /connections:
    get:
      tags: [profile]
      responses:
        "200": { description: Connected providers }
  /connections/{provider}/start:
    post:
      tags: [profile]
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Provider authorization URL }
  /connections/{provider}/callback:
    post:
      tags: [profile]
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Provider connection result }
  /connections/{id}:
    delete:
