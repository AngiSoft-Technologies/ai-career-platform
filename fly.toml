# fly.toml app configuration for mboqara-api-angisoft
# Primary market: Africa (Johannesburg), with EU presence for global coverage

app = 'mboqara-api-angisoft'
primary_region = 'jnb'  # Johannesburg - primary market

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'node dist/db/migrate.js'
  strategy = 'rolling'

[env]
  API_URL = 'https://mboqara-api-angisoft.fly.dev'
  DEMO_MODE = 'false'
  GRPC_PORT = '50051'
  NODE_ENV = 'production'
  PORT = '8088'
  S3_BUCKET = 'uploads'
  WEB_ORIGIN = 'https://mboqara.angisoft.co.ke,https://mboqara.netlify.app,http://localhost:3000,http://localhost:3100'

[processes]
  app = 'node dist/index.js'
  worker = 'PROCESS_ROLE=worker node dist/index.js'

# HTTP service for the API (app processes)
[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/live'

# gRPC service
[[services]]
  protocol = ''
  internal_port = 50051
  processes = ['app']

  [[services.ports]]
    port = 50051
    handlers = ['tls']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

# VM sizing - separate configs for app and worker
[[vm]]
  name = 'app'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  name = 'worker'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048

[metrics]
  port = 9091
  path = '/metrics'