# fly.toml app configuration for mboqara-api-angisoft
# Primary market: Africa (Johannesburg), with EU presence for global coverage

app = 'mboqara-api-angisoft'
primary_region = 'jnb'  # Johannesburg - primary market

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'node dist/db/migrate.js'
  strategy = 'rolling'

[env]
  API_URL = 'https://mboqara-api-angisoft.fly.dev'
  DEMO_MODE = 'false'
  GRPC_PORT = '50051'
  NODE_ENV = 'production'
  PORT = '8088'
  S3_BUCKET = 'uploads'
  WEB_ORIGIN = 'https://mboqara.angisoft.co.ke,https://mboqara.vercel.app,http://localhost:3000,http://localhost:3003,http://localhost:3100'
  # Worker continuous polling mode - when set to "true", workers poll continuously
  # instead of using fixed intervals. Set interval via INGESTION_INTERVAL_MS etc.
  CONTINUOUS_INGESTION = 'true'
  CONTINUOUS_EMBEDDING = 'true'
  CONTINUOUS_MAINTENANCE = 'true'
  # Interval in milliseconds for continuous polling (default 30s for ingestion)
  INGESTION_INTERVAL_MS = '30000'
  EMBEDDING_INTERVAL_MS = '60000'
  MAINTENANCE_INTERVAL_MS = '300000'
  # Legacy interval vars (minutes) still supported for scheduler mode
  INGESTION_INTERVAL_MINUTES = '30'
  EMBEDDING_INTERVAL_MINUTES = '60'
  MAINTENANCE_INTERVAL_HOURS = '6'

# The role is derived from FLY_PROCESS_GROUP (see services/api/src/index.ts).
# Do not use inline `PROCESS_ROLE=... node ...` here: Fly stores the command as
# an argv array, so `PROCESS_ROLE=worker` becomes argv[0] and exec fails (ENOENT).
[processes]
  app = 'node dist/index.js'
  worker = 'node dist/index.js'

# HTTP service for the API (app processes)
[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = 'off'
  # Keep the Africa-heavy fleet (3x jnb) always warm.
  min_machines_running = 3
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/live'

# gRPC service
[[services]]
  protocol = ''
  internal_port = 50051
  processes = ['app']

  [[services.ports]]
    port = 50051
    handlers = ['tls']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

# VM sizing - separate configs for app and worker.
# Fly matches per-process VM config with `processes`, not `name`; using `name`
# silently applied the app sizing to the worker group as well.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  processes = ['worker']

[metrics]
  port = 9091
  path = '/metrics'